<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Tree Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: wide screens fit the viewport with the tree on the left and the controls in a column on the right; narrow screens stack them. */
:root {
  --paper: #f2ebdd; --panel: #fbf7ee; --ink: #1d1a16; --muted: #6e6457; --chip: #e6dccb;
  --felt: #1e5a44; --felt-2: #2b7258; --felt-ink: #d9eadf; --edge: rgba(240, 248, 242, 0.5);
  --card: #fbf7ee; --card-ink: #1d1a16; --card-red: #c0392b;
  --accent: #c0392b; --accent-ink: #fff8ee; --hot: #f2b632; --good: #2e7d4f; --bad: #c0392b;
  --term: #1d1a16; --term-ink: #efe7d8; --shadow: #1d1a16;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #191612; --panel: #27221c; --ink: #efe7d8; --muted: #a69a89; --chip: #332d25;
    --felt: #123828; --felt-2: #1b4a36; --felt-ink: #cfe3d6; --card: #f4eee1;
    --accent: #e0574a; --accent-ink: #1a1612; --good: #5cc08a; --bad: #ff7b6e;
    --term: #0e0c0a; --shadow: #000; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #191612; --panel: #27221c; --ink: #efe7d8; --muted: #a69a89; --chip: #332d25;
  --felt: #123828; --felt-2: #1b4a36; --felt-ink: #cfe3d6; --card: #f4eee1;
  --accent: #e0574a; --accent-ink: #1a1612; --good: #5cc08a; --bad: #ff7b6e;
  --term: #0e0c0a; --shadow: #000; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.3rem; line-height: 1; margin: 0; letter-spacing: -0.02em; }
header h1 .suit { color: var(--accent); font-size: 0.8em; margin-left: 6px; }
header p { margin: 8px 0 0; color: var(--muted); max-width: 65ch; }
nav.steps { display: flex; flex-wrap: wrap; }
nav.steps button {
  font: 600 0.95rem var(--font-body); padding: 9px 15px; border: 0; border-radius: 0;
  background: transparent; color: var(--ink); cursor: pointer;
}
nav.steps button:hover { background: var(--chip); }
nav.steps button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
nav.steps button .n { margin-right: 6px; }
nav.steps button .n.r { color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, svg .card:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.table {
  background: radial-gradient(ellipse at 50% 40%, var(--felt-2), var(--felt) 75%);
  box-shadow: inset 0 0 0 6px rgba(0, 0, 0, 0.18), inset 0 0 60px rgba(0, 0, 0, 0.25);
  padding: 16px; overflow-x: auto;
}
.table svg {
  display: block; width: 100%; height: auto; min-height: 160px; margin: 0 auto; overflow: visible;
  max-width: calc(var(--vbw, 600) * 1.7px); max-height: min(62vh, calc(var(--vbh, 200) * 1.7px));
}
.table { position: relative; }
.in-hand { position: absolute; top: 18px; right: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.in-hand .label { color: var(--felt-ink); }
.in-hand .c {
  position: relative; width: 84px; height: 116px; display: grid; place-items: center;
  background: var(--card); color: var(--card-ink); font: 800 2.6rem var(--font-display); opacity: 0.92;
  transform: rotate(5deg); box-shadow: 0 0 0 3px var(--hot), 5px 6px 0 rgba(0, 0, 0, 0.35);
}
.in-hand .c.long { font-size: 1.7rem; }
.in-hand .c .idx { position: absolute; top: 5px; left: 7px; font: 700 0.72rem var(--font-mono); color: var(--card-red); }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.stage { display: flex; flex-direction: column; gap: 20px; }
.panel { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 22px; align-content: start; }
@media (max-width: 720px) { .panel { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 900px) and (min-height: 520px) {
  body { padding-block: 18px; }
  .wrap { max-width: 1440px; height: calc(100dvh - 36px); gap: 16px; }
  header p { font-size: 0.95rem; }
  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); }
  .table { display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
  .table svg { height: 100%; max-height: calc(var(--vbh, 200) * 1.7px); }
  .panel { grid-template-columns: minmax(0, 1fr); overflow-y: auto; min-height: 0; padding: 0 8px 8px 0; }
}
.box { background: var(--panel); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
#main-box { box-shadow: 6px 6px 0 var(--shadow); }
#side-box { background: transparent; padding: 14px 2px 0; border-top: 3px solid var(--ink); }
.box h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; margin: 0; }
.box p { margin: 0; }
.label { font: 700 0.7rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.label.cmd { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 0.8rem; }
.prompt { font-size: 1.15rem; }
.prompt b, .mono { font-family: var(--font-mono); }
.msg { min-height: 1.5em; font-weight: 500; }
.msg.good { color: var(--good); }
.msg.bad { color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  font: 600 1rem var(--font-body); padding: 10px 16px; border: 0; border-radius: 0; cursor: pointer;
  background: var(--chip); color: var(--ink);
}
@media (prefers-reduced-motion: no-preference) { .btn { transition: transform 0.08s, box-shadow 0.08s; } }
.btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--accent); }
.btn:active:not(:disabled) { transform: none; box-shadow: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { box-shadow: 3px 3px 0 var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choices .btn { background: var(--ink); color: var(--paper); padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; line-height: 1.2; }
.choices .btn small { font-weight: 400; font-size: 0.78rem; opacity: 0.7; }
.keys { font-size: 0.8rem; color: var(--muted); }
.btn.small { font-size: 0.85rem; padding: 6px 11px; }
.hand { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
.chip {
  font: 600 0.9rem var(--font-mono); padding: 6px 8px; min-width: 2.4em; text-align: center;
  background: var(--card); color: var(--card-ink); box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.28);
}
.chip.now { background: var(--hot); color: #1d1a16; transform: translateY(-4px); box-shadow: 2px 6px 0 rgba(0, 0, 0, 0.3); }
.chip.done { text-decoration: line-through; opacity: 0.35; box-shadow: none; }
pre.term { background: var(--term); color: var(--term-ink); font: 0.9rem/1.45 var(--font-mono); padding: 12px 14px; margin: 0; overflow-x: auto; min-height: 3em; white-space: pre; }
.code { font: 0.82rem/1.55 var(--font-mono); background: var(--chip); padding: 12px 14px; margin: 0; overflow-x: auto; white-space: pre; }
input[type="text"], select {
  font: 0.95rem var(--font-mono); padding: 8px 10px; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0;
  background: var(--chip); color: var(--ink); min-width: 0; max-width: 100%;
}
input[type="text"] { flex: 1 1 200px; }
svg .edge { stroke: var(--edge); stroke-width: 2.5; }
svg .card .sh { fill: rgba(0, 0, 0, 0.35); }
svg .card .face { fill: var(--card); }
svg .card text { fill: var(--card-ink); }
svg .card .big { font-family: var(--font-display); font-weight: 800; }
svg .card .idx { font-family: var(--font-mono); font-size: 9px; font-weight: 700; fill: var(--card-red); }
svg .card .cnt { font-family: var(--font-mono); font-size: 10px; font-weight: 700; fill: var(--card-red); }
svg .card.cur .face { stroke: var(--hot); stroke-width: 4; }
svg .card.path .face { stroke: var(--hot); stroke-width: 2; stroke-dasharray: 5 3; }
svg .card.found .face { stroke: #7be0a6; stroke-width: 4; }
svg .card.printed { opacity: 0.45; }
svg .card.clickable { cursor: pointer; }
svg .card.clickable:hover .face { stroke: var(--hot); stroke-width: 3; }
svg .card.flash .face { stroke: #ff6b5b; stroke-width: 4; }
svg .ghost rect { fill: none; stroke: var(--edge); stroke-dasharray: 5 4; stroke-width: 1.5; }
svg .ghost text { fill: var(--felt-ink); font-family: var(--font-mono); font-size: 11px; }
svg .null rect, svg .null line { fill: none; stroke: var(--hot); stroke-dasharray: 4 3; stroke-width: 2; }
svg .null text { fill: var(--hot); font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
svg .empty { fill: var(--felt-ink); font-family: var(--font-body); font-size: 15px; }
@media (prefers-reduced-motion: no-preference) {
  svg .card { transition: opacity 0.25s, transform 0.12s; }
  svg .card.clickable:hover { transform: translate(-2px, -3px); }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Tree Cards<span class="suit" aria-hidden="true">&spades;</span></h1>
      <p>Build a binary search tree one card at a time, then search it, print it in order, and free it. The same steps as asgn6's <span class="mono">tree_add</span>, <span class="mono">tree_print</span> and <span class="mono">tree_free</span>.</p>
    </div>

  <nav class="steps" role="tablist" aria-label="Steps">
    <button role="tab" data-mode="build" aria-selected="true"><span class="n" aria-hidden="true">&spades;</span>Build</button>
    <button role="tab" data-mode="search" aria-selected="false"><span class="n r" aria-hidden="true">&hearts;</span>Search</button>
    <button role="tab" data-mode="print" aria-selected="false"><span class="n r" aria-hidden="true">&diams;</span>Print in order</button>
    <button role="tab" data-mode="free" aria-selected="false"><span class="n" aria-hidden="true">&clubs;</span>Free</button>
  </nav>
  </header>

  <div class="stage">
    <div class="table">
      <svg id="tree" viewBox="0 0 600 200" role="img" aria-label="The tree"></svg>
      <div class="in-hand" id="in-hand" hidden></div>
    </div>

    <div class="panel">
      <section class="box" id="main-box" aria-live="polite"></section>
      <section class="box" id="side-box"></section>
    </div>
  </div>
</div>

<script>
(function () {
  const DECKS = {
    mixed: [50, 30, 70, 40, 20, 80, 60, 30],
    sorted: [20, 30, 40, 50, 60, 70, 80],
    asgn: [222, 333, 111, 111, 333, 111]
  };
  const DECK_NAMES = {
    mixed: "Round 1: shuffled (50 30 70 40 20 80 60 30)",
    sorted: "Round 2: same cards, sorted (20 30 40 ... 80)",
    asgn: "asgn6 example (222 333 111 111 333 111)"
  };

  let mode = "build";
  let root = null;
  let nextId = 1;
  // build state
  let deckName = "mixed", deck = DECKS.mixed.slice(), deckPos = 0, cur = null, walkPath = [];
  // search state
  let targets = [], tIdx = 0, sCur = null, sPath = [], sDone = false, sSteps = 0;
  // print / free state
  let printed = [], freed = [], flashId = null;
  // play state
  let playText = "4 2 6 1 3 5 7";
  let msg = { text: "", kind: "" };

  const $ = (s) => document.querySelector(s);
  const svg = $("#tree"), mainBox = $("#main-box"), sideBox = $("#side-box"), inHand = $("#in-hand");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function newNode(key) { return { id: nextId++, key, count: 1, left: null, right: null }; }
  function insert(r, key) {
    if (!r) return newNode(key);
    let n = r;
    while (true) {
      if (key === n.key) { n.count++; return r; }
      const d = key < n.key ? "left" : "right";
      if (!n[d]) { n[d] = newNode(key); return r; }
      n = n[d];
    }
  }
  function nodes(r, out = []) { if (r) { nodes(r.left, out); out.push(r); nodes(r.right, out); } return out; }
  function postorder(r, out = []) { if (r) { postorder(r.left, out); postorder(r.right, out); out.push(r); } return out; }
  function height(r) { return r ? 1 + Math.max(height(r.left), height(r.right)) : 0; }
  function shape(r) { return r ? "(" + shape(r.left) + r.key + shape(r.right) + ")" : "."; }
  function dumpLines(n, depth, mark, out) {
    const pad = "    ".repeat(depth);
    if (!n) { out.push(pad + mark + " NULL"); return; }
    dumpLines(n.right, depth + 1, "/", out);
    out.push(pad + mark + " " + n.key + " (x" + n.count + ")");
    dumpLines(n.left, depth + 1, "\\", out);
  }
  function dump(r) { if (!r) return "(empty tree: root is NULL)"; const o = []; dumpLines(r, 0, "<", o); return o.join("\n"); }
  function printOut(list) { return list.map((n) => n.count + " " + n.key).join("\n"); }

  // ---------- drawing ----------
  const CW = 52, CH = 70, COL = 64, ROW = 98, PAD = 22;
  function layout(r) {
    const pos = new Map();
    let rank = 0;
    (function walk(n, d) { if (!n) return; walk(n.left, d + 1); pos.set(n.id, { x: PAD + CW / 2 + rank * COL, y: PAD + CH / 2 + d * ROW }); rank++; walk(n.right, d + 1); })(r, 0);
    return { pos, cols: rank };
  }
  function draw(opts = {}) {
    const { pos, cols } = layout(root);
    const h = height(root);
    const showNullOf = opts.nullsOf || null;
    const w = Math.max(360, PAD * 2 + CW + Math.max(cols - 1, 0) * COL + (showNullOf ? COL : 0));
    const ht = Math.max(150, PAD * 2 + CH + Math.max(h - 1, 0) * ROW + (showNullOf ? ROW : 0));
    let s = "";
    if (!root) {
      s += '<text class="empty" x="' + w / 2 + '" y="' + ht / 2 + '" text-anchor="middle">Empty table: root is NULL</text>';
    }
    // edges
    (function edges(n) {
      if (!n) return;
      const p = pos.get(n.id);
      for (const d of ["left", "right"]) {
        if (n[d]) { const c = pos.get(n[d].id); s += '<line class="edge" x1="' + p.x + '" y1="' + (p.y + CH / 2) + '" x2="' + c.x + '" y2="' + (c.y - CH / 2) + '"/>'; edges(n[d]); }
      }
    })(root);
    // NULL slots of the current node
    if (showNullOf) {
      const p = pos.get(showNullOf.id);
      for (const d of ["left", "right"]) {
        if (!showNullOf[d]) {
          const x = p.x + (d === "left" ? -COL / 2 : COL / 2), y = p.y + ROW * 0.85;
          s += '<g class="null"><line x1="' + p.x + '" y1="' + (p.y + CH / 2) + '" x2="' + x + '" y2="' + (y - 13) + '"/>' +
               '<rect x="' + (x - 24) + '" y="' + (y - 13) + '" width="48" height="26" rx="6"/>' +
               '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle">NULL</text></g>';
        }
      }
    }
    // cards
    for (const n of nodes(root)) {
      const p = pos.get(n.id);
      const gone = opts.freed && opts.freed.includes(n.id);
      const cls = ["card"];
      if (gone) {
        s += '<g class="ghost"><rect x="' + (p.x - CW / 2) + '" y="' + (p.y - CH / 2) + '" width="' + CW + '" height="' + CH + '" rx="3"/>' +
             '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle">freed</text></g>';
        continue;
      }
      if (opts.cur && opts.cur.id === n.id) cls.push("cur");
      else if (opts.found && opts.found.id === n.id) cls.push("found");
      else if (opts.path && opts.path.includes(n.id)) cls.push("path");
      if (opts.printed && opts.printed.includes(n.id)) cls.push("printed");
      if (opts.clickable) cls.push("clickable");
      if (flashId === n.id) cls.push("flash");
      s += '<g class="' + cls.join(" ") + '" data-id="' + n.id + '"' + (opts.clickable ? ' tabindex="0" role="button" aria-label="card ' + n.key + '"' : "") + '>' +
           cardSVG(n, p.x, p.y, CW, CH, 22) +
           '</g>';
    }
    setView(w, ht);
    svg.innerHTML = s;
    if (opts.clickable) {
      svg.querySelectorAll(".card.clickable").forEach((g) => {
        const id = Number(g.dataset.id);
        g.addEventListener("click", () => opts.clickable(id));
        g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); opts.clickable(id); } });
      });
    }
  }
  function cardSVG(n, x, y, w, h, size) {
    const l = x - w / 2, t = y - h / 2;
    const fs = size * 3 / Math.max(3, String(n.key).length);
    return '<rect class="sh" x="' + (l + 3) + '" y="' + (t + 3) + '" width="' + w + '" height="' + h + '" rx="3"/>' +
      '<rect class="face" x="' + l + '" y="' + t + '" width="' + w + '" height="' + h + '" rx="3"/>' +
      '<text class="idx" x="' + (l + 5) + '" y="' + (t + 12) + '">' + n.key + '</text>' +
      '<text class="big" x="' + x + '" y="' + (y + fs * 0.36) + '" text-anchor="middle" font-size="' + fs + '">' + n.key + '</text>' +
      (n.count > 1 ? '<text class="cnt" x="' + (l + w - 5) + '" y="' + (t + h - 6) + '" text-anchor="end">x' + n.count + '</text>' : "");
  }
  function drawOne(n, depth) {
    const w = 360, ht = 222, cx = 180, cy = 70, bw = 76, bh = 100;
    let s = '<text class="empty" x="12" y="22">level ' + (depth + 1) + '</text>';
    for (const [d, x] of [["left", cx - 110], ["right", cx + 110]]) {
      s += '<line class="edge" x1="' + cx + '" y1="' + (cy + bh / 2) + '" x2="' + x + '" y2="162"/>' +
           '<g class="ghost"><rect x="' + (x - 30) + '" y="162" width="60" height="54" rx="3"/>' +
           '<text x="' + x + '" y="184" text-anchor="middle">' + d + '</text><text x="' + x + '" y="202" text-anchor="middle">?</text></g>';
    }
    s += '<g class="card cur">' + cardSVG(n, cx, cy, bw, bh, 32) + '</g>';
    setView(w, ht);
    svg.innerHTML = s;
  }
  function setView(w, ht) {
    svg.setAttribute("viewBox", "0 0 " + w + " " + ht);
    svg.style.setProperty("--vbw", w);
    svg.style.setProperty("--vbh", ht);
  }
  function byId(id) { return nodes(root).find((n) => n.id === id); }
  function msgHTML() { return '<div class="msg ' + msg.kind + '">' + msg.text + "</div>"; }
  function say(text, kind = "") { msg = { text, kind }; }

  // ---------- 1. Build ----------
  function startDeck(name, custom) {
    deckName = name;
    deck = custom ? custom.slice() : DECKS[name].slice();
    root = null; nextId = 1; deckPos = 0; cur = null; walkPath = []; undoStack = [];
    resetLater();
    say("");
  }
  function resetLater() { targets = []; printed = []; freed = []; sDone = false; }
  let undoStack = [];
  function snap() { return JSON.stringify({ root, nextId, deckPos, cur: cur ? cur.id : null, walkPath }); }
  function undo() {
    if (!undoStack.length) return;
    const st = JSON.parse(undoStack.pop());
    root = st.root; nextId = st.nextId; deckPos = st.deckPos; walkPath = st.walkPath;
    cur = st.cur === null ? null : byId(st.cur);
    resetLater(); say("Undid the last move."); render();
  }
  function buildChoice(choice) {
    const key = deck[deckPos];
    undoStack.push(snap());
    resetLater();
    if (!root) {
      root = newNode(key); deckPos++;
      say("The tree was empty, so " + key + " becomes the root. (In tree_add, saved points at tree-&gt;root.)");
      cur = null; walkPath = []; return render();
    }
    const at = cur || root;
    if (choice === "same") {
      at.count++; deckPos++; cur = null; walkPath = [];
      say(at.key + "'s count goes up to " + at.count + ". No new card.");
      return render();
    }
    walkPath.push(at.id);
    if (!at[choice]) {
      at[choice] = newNode(key); deckPos++; cur = null; walkPath = [];
      say(at.key + "'s " + choice + " was NULL, so " + key + " goes there. That NULL is the pointer saved points to.");
    } else {
      cur = at[choice];
      say("Went " + choice + " to " + cur.key + ".");
    }
    render();
  }
  function placeRest() {
    undoStack.push(snap()); resetLater();
    while (deckPos < deck.length) { root = insert(root, deck[deckPos]); deckPos++; }
    cur = null; walkPath = []; say("Placed the rest of the deck.", "good"); render();
  }
  function renderBuild() {
    const done = deckPos >= deck.length;
    const key = deck[deckPos];
    const at = cur || root;
    if (!done) {
      inHand.innerHTML = '<div class="label">In hand</div><div class="c' + (String(key).length > 3 ? " long" : "") + '"><span class="idx">' + key + "</span>" + key + "</div>";
      inHand.hidden = false;
    }
    draw({ cur: done ? null : at, path: walkPath, nullsOf: done || !root ? null : at });
    let h = '<div class="label">Your hand</div><div class="hand">' +
      deck.map((k, i) => '<span class="chip ' + (i < deckPos ? "done" : i === deckPos ? "now" : "") + '">' + k + "</span>").join("") + "</div>";
    if (done) {
      h += '<div class="prompt">All cards are placed. The tree is ' + height(root) + " levels tall.</div>" + msgHTML() +
        '<div class="row"><button class="btn primary" id="go-search">Next: Search</button></div>';
    } else if (!root) {
      h += '<div class="prompt">Card <b>' + key + "</b>. The table is empty (root is NULL).</div>" + msgHTML() +
        '<div class="row"><button class="btn primary" data-c="root">Place it as the root</button></div>';
    } else {
      h += '<div class="prompt">Card <b>' + key + "</b> is at <b>" + at.key + "</b>. Which way?</div>" + msgHTML() +
        '<div class="choices"><button class="btn" data-c="left">&larr; Left<small>smaller</small></button>' +
        '<button class="btn" data-c="same">Same<small>count +1</small></button>' +
        '<button class="btn" data-c="right">Right &rarr;<small>bigger</small></button></div>' +
        '<div class="keys">Keyboard: &larr; left, &darr; same, &rarr; right</div>';
    }
    h += '<div class="row"><button class="btn small" id="undo"' + (undoStack.length ? "" : " disabled") + '>Undo</button></div>';
    mainBox.innerHTML = '<h2>1. Build the tree</h2>' + h;
    mainBox.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => buildChoice(b.dataset.c)));
    const gs = $("#go-search"); if (gs) gs.addEventListener("click", () => setMode("search"));
    $("#undo").addEventListener("click", undo);
    sideBox.innerHTML = '<h2>Deck</h2><div class="row"><select id="deck">' +
      Object.keys(DECKS).map((k) => '<option value="' + k + '"' + (k === deckName ? " selected" : "") + ">" + DECK_NAMES[k] + "</option>").join("") +
      (deckName === "custom" ? '<option value="custom" selected>Your own cards</option>' : "") +
      '</select></div><div class="row"><input type="text" id="custom" placeholder="Your own: 8 3 10 1 6" aria-label="Your own cards">' +
      '<button class="btn small" id="use-custom">Use these</button></div>' +
      '<div class="row"><button class="btn small" id="restart">Start over</button><button class="btn small" id="rest"' + (done ? " disabled" : "") + '>Place the rest for me</button></div>' +
      '<div class="label">Spec 2.2: tree_add</div><pre class="code">saved = &amp;(tree-&gt;root)\ncurrent_node = tree-&gt;root\nwhile current_node != NULL:\n    equal?   count += 1, return\n    smaller? saved = &amp;(current_node-&gt;left)\n             go left\n    bigger?  saved = &amp;(current_node-&gt;right)\n             go right\nnew node, count = 1\n*saved = new_node</pre>';
    $("#deck").addEventListener("change", (e) => { if (e.target.value !== "custom") { startDeck(e.target.value); render(); } });
    $("#restart").addEventListener("click", () => { deckName === "custom" ? startDeck("custom", deck) : startDeck(deckName); render(); });
    $("#rest").addEventListener("click", placeRest);
    $("#use-custom").addEventListener("click", () => {
      const nums = parseNums($("#custom").value);
      if (!nums.length) { say("Type some whole numbers separated by spaces.", "bad"); return render(); }
      startDeck("custom", nums); render();
    });
  }

  // ---------- 2. Search ----------
  function makeTargets() {
    const list = nodes(root);
    if (!list.length) return [];
    const keys = list.map((n) => n.key);
    let deepest = list[0], dmax = -1;
    (function d(n, k) { if (!n) return; if (k > dmax || (k === dmax && n.key > deepest.key)) { dmax = k; deepest = n; } d(n.left, k + 1); d(n.right, k + 1); })(root, 0);
    let missing = null;
    for (let i = Math.floor(keys.length / 2); i < keys.length - 1 && missing === null; i++) {
      if (keys[i + 1] - keys[i] > 1) missing = keys[i] + Math.max(1, Math.round((keys[i + 1] - keys[i]) / 2));
    }
    if (missing === null) missing = keys[keys.length - 1] + 5;
    const out = [deepest.key, missing];
    const dup = list.find((n) => n.count > 1 && n.key !== deepest.key);
    out.push(dup ? dup.key : keys[0] - 5);
    return out;
  }
  function startSearch() { sCur = root; sPath = []; sDone = false; sSteps = 0; }
  function searchChoice(choice) {
    const key = targets[tIdx];
    const at = sCur;
    sSteps++;
    const checked = " Checked " + sSteps + " card" + (sSteps > 1 ? "s" : "") + ". Here's the whole tree with your path.";
    if (choice === "found") { sDone = "found"; say("Stopped at " + at.key + " (count " + at.count + ")." + checked); return render(); }
    sPath.push(at.id);
    if (!at[choice]) { sDone = "missing"; say(at.key + "'s " + choice + " is NULL, so the search ends: not found." + checked); return render(); }
    sCur = at[choice]; say("Went " + choice + ". Now you're at a new card."); render();
  }
  function renderSearch() {
    if (!root) { draw(); mainBox.innerHTML = "<h2>2. Search</h2><p>Build a tree first (step 1).</p>"; sideBox.innerHTML = ""; return; }
    if (!targets.length) { targets = makeTargets(); tIdx = 0; startSearch(); }
    const key = targets[tIdx];
    if (sDone) draw({ found: sDone === "found" ? sCur : null, path: sPath });
    else drawOne(sCur, sPath.length);
    let h = '<h2>2. Search</h2><div class="label">Find these</div><div class="hand">' +
      targets.map((k, i) => '<span class="chip ' + (i < tIdx ? "done" : i === tIdx ? "now" : "") + '">' + k + "</span>").join("") + "</div>";
    if (sDone) {
      h += '<div class="prompt">Looking for <b>' + key + "</b>.</div>" + msgHTML() + '<div class="row">' +
        (tIdx < targets.length - 1 ? '<button class="btn primary" id="next-t">Next key</button>' : '<button class="btn primary" id="go-print">Next: Print in order</button>') + "</div>";
    } else {
      h += '<div class="prompt">Looking for <b>' + key + "</b>. You\'re at <b>" + sCur.key + "</b>. Which way?</div>" + msgHTML() +
        '<div class="choices"><button class="btn" data-c="left">&larr; Left<small>smaller</small></button><button class="btn" data-c="found">Found it<small>equal</small></button><button class="btn" data-c="right">Right &rarr;<small>bigger</small></button></div>' +
        '<div class="keys">Keyboard: &larr; left, &darr; found, &rarr; right</div>';
    }
    mainBox.innerHTML = h;
    mainBox.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => searchChoice(b.dataset.c)));
    const nt = $("#next-t"); if (nt) nt.addEventListener("click", () => { tIdx++; startSearch(); say(""); render(); });
    const gp = $("#go-print"); if (gp) gp.addEventListener("click", () => setMode("print"));
    sideBox.innerHTML = '<h2>Try your own</h2><div class="row"><input type="text" id="find" placeholder="Key to find" aria-label="Key to find"><button class="btn small" id="find-go">Find</button></div>' +
      '<p>You only see the card you\'re on. The program is the same: it only has a pointer to the current node, and has to follow left or right to see more.</p>' +
      '<div class="label">Spec 2.1</div><p>Start at the root. Equal: done. Smaller: go left. Bigger: go right. If you reach a NULL, the key isn\'t in the tree. Every step goes down one level, so a taller tree can mean more checks.</p>';
    $("#find-go").addEventListener("click", () => {
      const n = parseNums($("#find").value)[0];
      if (n === undefined) return;
      targets.splice(tIdx + (sDone ? 1 : 0), 0, n); if (sDone) tIdx++; startSearch(); say(""); render();
    });
  }

  // ---------- 3. Print in order ----------
  function printClick(id) {
    const order = nodes(root);
    const expect = order[printed.length];
    if (!expect) return;
    if (id === expect.id) {
      printed.push(id); flashId = null;
      say(printed.length === order.length ? "Done. In-order visits every card from smallest to biggest, so the output is sorted." : "Printed " + expect.count + " " + expect.key + ".", "good");
    } else {
      const n = byId(id);
      if (printed.includes(id)) say(n.key + " is already printed.", "bad");
      else if (n.left && !printed.includes(n.left.id)) say("Not yet. " + n.key + " still has cards on its left, and those print before it.", "bad");
      else say("Not yet. Something smaller than " + n.key + " still hasn't printed. In-order is left side, then the card, then right side.", "bad");
      flashId = id;
    }
    render();
    flashId = null;
  }
  function renderPrint() {
    if (!root) { draw(); mainBox.innerHTML = "<h2>3. Print in order</h2><p>Build a tree first (step 1).</p>"; sideBox.innerHTML = ""; return; }
    const order = nodes(root);
    const list = printed.map(byId);
    draw({ printed, clickable: printed.length < order.length ? printClick : null });
    mainBox.innerHTML = '<h2>3. Print in order</h2><div class="prompt">Click the cards in the order an in-order traversal prints them.</div>' + msgHTML() +
      '<div class="label cmd">$ ./unique ...</div><pre class="term">' + esc(printOut(list)) + "</pre>" +
      '<div class="row"><button class="btn small" id="p-reset">Start over</button>' + (printed.length === order.length ? '<button class="btn primary" id="go-free">Next: Free</button>' : "") + "</div>";
    $("#p-reset").addEventListener("click", () => { printed = []; say(""); render(); });
    const gf = $("#go-free"); if (gf) gf.addEventListener("click", () => setMode("free"));
    sideBox.innerHTML = '<div class="label">Spec 2.3</div><pre class="code">traverse_in_order(node):\n    if node is not NULL:\n        traverse_in_order(node-&gt;left)\n        visit the node (print it)\n        traverse_in_order(node-&gt;right)</pre>' +
      '<p>Each line is the count, then the key, like the real <span class="mono">unique</span>.</p>';
  }

  // ---------- 4. Free ----------
  function freeClick(id) {
    const n = byId(id);
    if (freed.includes(id)) return;
    const kids = ["left", "right"].filter((d) => n[d] && !freed.includes(n[d].id)).map((d) => n[d]);
    if (kids.length) {
      say("Can't free " + n.key + " yet: " + kids.map((k) => k.key).join(" and ") + (kids.length > 1 ? " are" : " is") +
        " still under it. Once " + n.key + " is freed you can't read its left and right pointers anymore, so those cards would be lost.", "bad");
      flashId = id;
    } else {
      freed.push(id); flashId = null;
      say(freed.length === nodes(root).length ? "Every card is freed. Now tree-&gt;root can be set to NULL. Next up: the family tree in week7-c-lab." : "free(" + n.key + ")", "good");
    }
    render(); flashId = null;
  }
  function renderFree() {
    if (!root) { draw(); mainBox.innerHTML = "<h2>4. Free</h2><p>Build a tree first (step 1).</p>"; sideBox.innerHTML = ""; return; }
    const all = nodes(root);
    const done = freed.length === all.length;
    draw({ freed, clickable: done ? null : freeClick });
    const post = postorder(root).map((n) => n.key).join(" ");
    mainBox.innerHTML = '<h2>4. Free the tree</h2><div class="prompt">Pick up the cards one at a time. Rule: you can only free a card with nothing under it.</div>' + msgHTML() +
      '<div class="label">Your order</div><pre class="term">' + esc(freed.map((id) => "free(" + byId(id).key + ")").join("\n")) + "</pre>" +
      (done ? '<p>Post-order frees them as <b class="mono">' + post + "</b>. It always takes the children before their parent, so it follows the rule automatically.</p>" : "") +
      '<div class="row"><button class="btn small" id="f-reset">Start over</button>' + "" + "</div>";
    $("#f-reset").addEventListener("click", () => { freed = []; say(""); render(); });
    sideBox.innerHTML = '<div class="label">Spec 2.3</div><pre class="code">traverse_post_order(node):\n    if node is not NULL:\n        traverse_post_order(node-&gt;left)\n        traverse_post_order(node-&gt;right)\n        visit the node (free it)</pre>' +
      '<p>Why not free the parent first? After <span class="mono">free(node)</span>, reading <span class="mono">node-&gt;left</span> is a use-after-free bug.</p>';
  }

  function parseNums(t) { return (t.match(/-?\d+/g) || []).map(Number); }

  // ---------- mode switching ----------
  function setMode(m) {
    mode = m; say("");
    document.querySelectorAll("nav.steps button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
    if (m === "search" && root) { targets = makeTargets(); tIdx = 0; startSearch(); }
    render();
  }
  function render() {
    inHand.hidden = true;
    ({ build: renderBuild, search: renderSearch, print: renderPrint, free: renderFree })[mode]();
  }
  document.querySelectorAll("nav.steps button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (mode !== "build" && mode !== "search") return;
    const map = { ArrowLeft: "left", ArrowRight: "right", ArrowDown: mode === "build" ? "same" : "found" };
    const c = map[e.key];
    const btn = c && mainBox.querySelector('[data-c="' + c + '"]');
    if (btn) { e.preventDefault(); btn.click(); }
  });
  startDeck("mixed");
  // open with the first two cards placed so the page shows a tree at rest
  root = newNode(50); root.left = newNode(30); deckPos = 2;
  say("50 is the root and 30 went left of it. Your turn: place 70.");
  render();
})();
</script>
</body>
</html>
